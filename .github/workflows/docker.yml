name: Docker

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    # Native arch runners. Arm is the org 8 vCPU label plus Blacksmith's -arm suffix
    # (blacksmith-8vcpu-ubuntu-2404 -> blacksmith-8vcpu-ubuntu-2404-arm).
    runs-on: ${{ matrix.arch == 'arm64' && format('{0}-arm', vars.BLACKSMITH_8VCPU_UBUNTU_LATEST) || vars.BLACKSMITH_8VCPU_UBUNTU_LATEST }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name
        id: image
        run: printf 'name=ghcr.io/%s\n' "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          nofallback: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch manifest
    needs: build
    runs-on: ${{ vars.BLACKSMITH_2VCPU_UBUNTU_LATEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name
        id: image
        run: printf 'name=ghcr.io/%s\n' "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          cd /tmp/digests

          tag_args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tag_args+=(-t "$tag")
          done <<< "$TAGS"
          [ "${#tag_args[@]}" -gt 0 ]

          digest_refs=()
          for digest in *; do
            digest_refs+=("$IMAGE@sha256:$digest")
          done
          [ "${#digest_refs[@]}" -eq 2 ] || {
            echo "Expected 2 arch digests, found ${#digest_refs[@]}" >&2
            exit 1
          }

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"
          docker buildx imagetools inspect "${tag_args[1]}"
